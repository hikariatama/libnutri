<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>libnutri</title>
    <meta
      name="description"
      content="The simplest nutrition tracker. Say what you ate and get calories, protein and fiber."
    />
    <meta name="theme-color" content="#111214" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.png?v=ios-20261026" />
    <link rel="apple-touch-icon" href="/icon.png?v=ios-20261026" />
    <link rel="preload" href="/fonts/huninn-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script src="/main.js" defer></script>
  </head>
  <body class="site-body">
    <main class="site-page nutrition-page">
      <header class="site-header">
        <img class="site-icon" src="/icon.png?v=ios-20261026" alt="" width="44" height="44" />
        <div class="site-title">
          <h1>libnutri</h1>
          <p>The simplest nutrition tracker. Say what you ate. Get calories, protein and fiber.</p>
        </div>
        <nav class="site-actions" aria-label="Downloads">
          <!-- Placeholder URLs for the build and repository. -->
          <a
            class="site-button primary"
            href="https://github.com/hikariatama/libnutri/releases/latest/download/libnutri-iphone-unsigned.ipa"
            title="Unsigned IPA; sign before installation"
            >Download for iPhone</a
          >
          <a class="site-button" href="https://github.com/hikariatama/libnutri">GitHub</a>
        </nav>
      </header>

      <div class="demos site-stage">
        <figure>
          <div class="screen site-demo" data-demo="phone" data-state="idle" aria-hidden="true">
            <div class="bar">
              <span class="date">Today</span>
              <span class="glass round">
                <span class="sf" data-symbol="calendar"></span>
              </span>
              <span class="glass round">
                <span class="sf" data-symbol="gearshape"></span>
              </span>
            </div>

            <div class="total">
              <span class="value" data-key="calories">0</span>
              <span class="label">calories</span>
            </div>
            <div class="pair">
              <div>
                <span class="value" data-key="protein">0 g</span>
                <span class="label">protein</span>
              </div>
              <span class="rule"></span>
              <div>
                <span class="value" data-key="fiber">0 g</span>
                <span class="label">fiber</span>
              </div>
            </div>

            <div class="heard"><p></p></div>

            <div class="actions">
              <span class="glass button mic">
                <span class="sf idle-icon" data-symbol="mic"></span>
                <span class="recording">
                  <span class="level">
                    <span class="sf stop" data-symbol="stop.fill"></span>
                    <span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
                  </span>
                  <span class="timer">0:00</span>
                </span>
                <span class="spinner"></span>
              </span>
              <span class="glass button keys">
                <span class="sf idle-icon" data-symbol="keyboard"></span>
                <span class="spinner"></span>
              </span>
              <span class="glass button">
                <span class="sf" data-symbol="clock.arrow.circlepath"></span>
              </span>
            </div>

            <div class="sheet">
              <span class="grabber"></span>
              <div class="sheet-bar">
                <span class="glass round"><span class="sf" data-symbol="xmark"></span></span>
                <span>Log food</span>
              </div>
              <p class="field"><span class="typed"></span><span class="caret"></span></p>
              <span class="send">
                <span class="sf" data-symbol="arrow.up"></span>
                <span class="spinner"></span>
                <span class="send-label">Send</span>
              </span>
            </div>
          </div>
          <figcaption>On iPhone, say or type what you ate.</figcaption>
        </figure>

        <figure>
          <div class="screen chat site-demo" data-demo="chat" aria-hidden="true">
            <p class="message mine" data-at="1">Find something to eat near me, add it to Nutri</p>
            <ol class="calls">
              <li data-at="2">
                <span class="sf" data-symbol="chart.bar"></span>
                <span class="tool">libnutri · get_nutrition</span>
              </li>
              <li data-at="3">
                <span class="sf" data-symbol="magnifyingglass"></span>
                <span class="tool">grabfood · search_food</span>
              </li>
              <li data-at="4">
                <span class="sf" data-symbol="plus.circle"></span>
                <span class="tool">libnutri · add_meal</span>
              </li>
            </ol>
            <p class="message reply" data-at="5">
              Here is a <span class="link">cheeseburger</span>, it’s only 300 kcal / 15 protein / 2
              fiber, will fill the gaps.
            </p>
          </div>
          <figcaption>
            In ChatGPT, add libnutri as an MCP server:
            <span class="endpoint">
              <code>https://libnutri.avx.so/mcp</code>
              <button type="button" data-copy="https://libnutri.avx.so/mcp">Copy</button>
            </span>
          </figcaption>
        </figure>
      </div>
